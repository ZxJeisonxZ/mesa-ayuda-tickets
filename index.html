<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mesa de Ayuda - Tickets de Soporte</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">
  <header class="bg-indigo-700 text-white shadow">
    <div class="max-w-6xl mx-auto px-4 py-4 flex flex-wrap items-center justify-between gap-3">
      <div>
        <h1 class="text-2xl font-bold">Mesa de Ayuda</h1>
        <p class="text-indigo-200 text-sm">Gestión de tickets de soporte y mantenimiento de software</p>
      </div>
      <span class="text-xs bg-indigo-900/40 px-2 py-1 rounded">v1.0.1</span>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-6 grid gap-6 lg:grid-cols-3">
    <!-- Formulario de registro -->
    <section class="bg-white rounded-xl shadow p-5 lg:col-span-1 h-fit">
      <h2 class="text-lg font-semibold mb-4">Nuevo ticket</h2>
      <form id="ticket-form" class="space-y-3" novalidate>
        <div>
          <label for="titulo" class="block text-sm font-medium mb-1">Título</label>
          <input id="titulo" name="titulo" type="text" class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-400" placeholder="Ej: Error al generar factura" maxlength="80">
          <p data-error="titulo" class="hidden text-xs text-red-600 mt-1"></p>
        </div>
        <div>
          <label for="descripcion" class="block text-sm font-medium mb-1">Descripción</label>
          <textarea id="descripcion" name="descripcion" rows="3" class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-400" placeholder="Describe el problema o la solicitud"></textarea>
          <p data-error="descripcion" class="hidden text-xs text-red-600 mt-1"></p>
        </div>
        <div>
          <label for="solicitante" class="block text-sm font-medium mb-1">Solicitante</label>
          <input id="solicitante" name="solicitante" type="text" class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-400" placeholder="Nombre de quien reporta">
          <p data-error="solicitante" class="hidden text-xs text-red-600 mt-1"></p>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label for="prioridad" class="block text-sm font-medium mb-1">Prioridad</label>
            <select id="prioridad" name="prioridad" class="w-full border rounded-lg px-3 py-2 bg-white">
              <option value="baja">Baja</option>
              <option value="media" selected>Media</option>
              <option value="alta">Alta</option>
              <option value="critica">Crítica</option>
            </select>
          </div>
          <div>
            <label for="tipo" class="block text-sm font-medium mb-1">Tipo</label>
            <select id="tipo" name="tipo" class="w-full border rounded-lg px-3 py-2 bg-white">
              <option value="correctivo">Correctivo</option>
              <option value="adaptativo">Adaptativo</option>
              <option value="perfectivo">Perfectivo</option>
              <option value="preventivo">Preventivo</option>
            </select>
          </div>
        </div>
        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg py-2 transition">
          Registrar ticket
        </button>
      </form>
    </section>

    <!-- Listado de tickets -->
    <section class="lg:col-span-2">
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-lg font-semibold">Tickets</h2>
        <span id="ticket-count" class="text-sm text-slate-500"></span>
      </div>
      <div id="ticket-list" class="space-y-3"></div>
    </section>
  </main>

  <footer class="text-center text-xs text-slate-400 py-6">
    Mesa de Ayuda &middot; Proyecto académico - Mantenimiento de Software
  </footer>

  <script src="js/validation.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
